<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#151d2d"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Glowing Polyhedron / Star of Talent -->
  <g filter="url(#glow)">
    <!-- Inner faceted geometry -->
    <polygon points="32,8 52,22 44,48 20,48 12,22" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="32,18 42,26 38,40 26,40 22,26" fill="rgba(99,102,241,0.25)" stroke="#06b6d4" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Central Star of Genius -->
    <path d="M32 14 L34 26 L46 28 L36 34 L39 46 L32 38 L25 46 L28 34 L18 28 L30 26 Z" fill="url(#glowGrad)" />

    <!-- Radiant Nodes -->
    <circle cx="32" cy="8" r="2.5" fill="#06b6d4"/>
    <circle cx="52" cy="22" r="2.5" fill="#6366f1"/>
    <circle cx="44" cy="48" r="2.5" fill="#a855f7"/>
    <circle cx="20" cy="48" r="2.5" fill="#10b981"/>
    <circle cx="12" cy="22" r="2.5" fill="#f59e0b"/>
    <circle cx="32" cy="30" r="3" fill="#ffffff"/>
  </g>
</svg>
